server {
    server_name spritenote.duckdns.org;

    # Security headers — the app has no external script/style/font dependencies (everything is
    # self-hosted, no inline <script> or event-handler attributes), so a strict CSP is feasible.
    # 'unsafe-inline' is kept only for style-src (the app uses some inline style="" attributes);
    # inline styles are a much weaker XSS primitive than inline scripts, which stay locked down.
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Админка наружу не отдаётся: управление пользователями, файловый менеджер по всей файловой
    # системе, выгрузка проекта и веб-терминал (полноценный shell). Домен резолвится в публичный
    # адрес, то есть при пробросе портов на роутере эта дверь смотрит в интернет. Приложение и так
    # закрывает её requireAdmin, но выставлять наружу то, за чем стоит shell, незачем.
    # Префикс покрывает и WebSocket терминала: он открывается на /api/admin/terminal.
    # 404, а не 403 — чтобы не подтверждать снаружи, что здесь вообще что-то есть.
    #
    # Админка остаётся доступной из локальной сети (см. vhost spritenote-lan).
    location /api/admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        client_max_body_size 1100M;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/spritenote.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/spritenote.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = spritenote.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name spritenote.duckdns.org;
    return 404; # managed by Certbot


}
