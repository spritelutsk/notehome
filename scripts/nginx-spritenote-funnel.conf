# nginx vhost для доступа снаружи через Tailscale Funnel.
#
# Провайдер держит абонента за CGNAT, поэтому проброс портов на роутере невозможен
# (типичная ситуация у домашних провайдеров). Funnel открывает приложение наружу исходящим
# туннелем: TLS терминирует сам Tailscale, а сюда трафик приходит уже открытым, на 80.
#
# Установка:
#   sudo cp scripts/nginx-spritenote-funnel.conf /etc/nginx/sites-available/spritenote-funnel
#   sudo ln -s /etc/nginx/sites-available/spritenote-funnel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   tailscale funnel --bg 80
#
# server_name должен совпадать с DNS-именем узла в тайлнете (`tailscale status --json`
# → Self.DNSName). Блок обязан существовать отдельно от spritenote-lan: тот стоит
# default_server и выставил бы X-Forwarded-Proto http, из-за чего приложение считало бы
# соединение незашифрованным и не ставило бы флаг Secure на сессионную куку.

server {
    listen 80;
    listen [::]:80;
    server_name sprite.taile46903.ts.net;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Клиент пришёл по HTTPS — TLS снял Tailscale. Здесь $scheme равен http, поэтому
    # значение задано константой: иначе req.secure в приложении будет false и сессионная
    # кука уедет без флага Secure.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Админка наружу не отдаётся: управление пользователями, файловый менеджер по всей
    # файловой системе, выгрузка проекта и веб-терминал (полноценный shell). Приложение и так
    # закрывает их requireAdmin, но выставлять на публичный адрес то, за чем стоит shell,
    # незачем — из LAN и через сам Tailscale админка остаётся доступна как раньше.
    # Префикс покрывает и WebSocket терминала: он открывается на /api/admin/terminal.
    # 404, а не 403 — чтобы не подтверждать снаружи, что здесь вообще что-то есть.
    location /api/admin {
        return 404;
    }

    # Свой сервер RustDesk наружу: hbbs и hbbr умеют WebSocket (21118 и 21119), а Funnel
    # даёт им TLS и публичный адрес. Без этого «Управлять» со своим сервером работало
    # только из локальной сети и тайлнета: порты 21115-21119 наружу не смотрят, и открыть
    # их нельзя — провайдер держит абонента за CGNAT, проброс на роутере невозможен.
    #
    # Пути заданы RustDesk, а не выбраны нами: клиент выводит их из адреса API-сервера
    # (https:// → wss://) и дописывает /ws/id и /ws/relay сам. Переименовать нельзя.
    #
    # Порты 21115-21119 при этом остаются открытыми в локальной сети и тайлнете: там
    # клиент ходит по TCP/UDP напрямую, а это быстрее — WebSocket умеет только
    # ретрансляцию, то есть весь трафик пошёл бы через hbbr.
    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # В образце RustDesk здесь 120s. Поднято до часа по той же причине, что и у
        # терминала выше: сеанс управления может простоять без единого байта дольше двух
        # минут, а разорванный по таймауту сокет выглядит как «само отвалилось».
        proxy_read_timeout 3600s;
    }

    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        client_max_body_size 1100M;
    }
}
