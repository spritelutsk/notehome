# Дополнение к /etc/turnserver.conf для SpriteNote: свой STUN/TURN, без которого просмотр
# экрана собирает одни host-кандидаты и работает разве что случайно.
#
# Ставится дописыванием в конец штатного файла, а не заменой: у пакета coturn там 29 КБ
# комментариев и четыре рабочие строки, и ни одна из них с этими не спорит.
#
#     sudo cp -a /etc/turnserver.conf /etc/turnserver.conf.bak-$(date +%F)
#     sudo tee -a /etc/turnserver.conf < scripts/turnserver-spritenote.conf
#     sudo systemctl enable --now coturn
#
# static-auth-secret ниже оставлен пустым намеренно: секрет генерируется на месте
# (`openssl rand -hex 32`) и обязан совпасть с TURN_SECRET в .env приложения.

listening-port=3478

# Realm — произвольная строка, она никуда не резолвится и нужна только затем, чтобы клиент
# и сервер считали HMAC от одного и того же. Имени домена здесь намеренно нет: сменится
# адрес — реквизиты останутся рабочими.
realm=spritenote

# Временные реквизиты вместо постоянной пары логин-пароль: имя это срок годности, пароль —
# HMAC-SHA1 от имени этим секретом. Расходятся секреты молча, обычным «не соединяется», —
# правите здесь, правьте и TURN_SECRET.
use-auth-secret
static-auth-secret=

# Наружу этот ретранслятор не смотрит: работают два пути — локальная сеть и тайлнет, оба
# ведут к машине напрямую. Строки external-ip здесь нет намеренно. Она подменяет адрес в
# выдаваемых кандидатах на публичный, и клиент из локальной сети получил бы адрес, до
# которого не дотянется через собственный роутер. Понадобится путь снаружи — вернуть её
# вместе с пробросом портов на роутере.

# Узкий диапазон вместо стандартных 49152-65535: на каждый сеанс уходит по одному порту,
# а короткий список проще и держать в голове, и пробрасывать, если до проброса дойдёт.
min-port=49160
max-port=49200

# Ретранслятор не должен становиться дорогой внутрь этой машины: на ней и база на
# 127.0.0.1:3306, и само приложение на 127.0.0.1:3000. Диапазон тайлнета (100.64.0.0/10)
# не закрыт намеренно — просмотр экрана между устройствами тайлнета идёт именно там.
# Локальная сеть не закрыта по той же причине: это второй из двух рабочих путей.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Потолок на случай, если реквизиты утекут: они живут сутки, и за эти сутки чужой не должен
# успеть выесть канал целиком.
user-quota=12
total-quota=100

fingerprint
no-cli
