# Записи пакетного журнала веб-портов (table inet log_web) — в отдельный файл.
#
# nftables пишет через ядро, то есть в kern.*, а оттуда всё утекает в /var/log/syslog
# и /var/log/kern.log. Под сканом это забивает общий журнал так, что в нём не найти
# ничего другого, поэтому строки уводятся к себе и обработка останавливается.
#
# contains, а не startswith: у сообщений ядра перед текстом правила бывает пробел.
# Дефис перед именем файла — запись без fsync на каждую строку, щадящий режим для SD-карты.

:msg, contains, "WEB-CONN " -/var/log/nftables-web.log
& stop

:msg, contains, "WEB-ODD " -/var/log/nftables-web.log
& stop
