# Журнал обращений на 80 и 443.
#
# Файл лежит в conf.d, то есть в контексте http, и потому накрывает сразу все vhost —
# и spritenote (443), и spritenote-funnel (80, вход снаружи через Tailscale), и
# spritenote-lan (80, default_server). Заводить новый сайт и не забыть про логи нельзя:
# он получит их по наследству.
#
# Штатный /var/log/nginx/access.log остаётся как был: несколько директив access_log
# на одном уровне разрешены, и старый файл продолжает писаться в прежнем формате.

# --- нормализация пустых полей ---------------------------------------------------
# Формат один на оба порта, а на 80 переменные TLS пустые. Без map строка получилась бы
# с дырами между разделителями, и её было бы неудобно разбирать глазами и awk.

map $ssl_protocol $log_tls_proto {
    ""      "-";
    default $ssl_protocol;
}

map $ssl_cipher $log_tls_cipher {
    ""      "-";
    default $ssl_cipher;
}

# SNI из ClientHello — имя, которое клиент спросил на уровне TLS. Отличается от $host:
# Host можно написать любой уже внутри шифрованного канала, а SNI виден раньше. У сканера,
# который стучится по голому IP, здесь пусто — это сам по себе признак.
map $ssl_server_name $log_tls_sni {
    ""      "-";
    default $ssl_server_name;
}

map $http_x_forwarded_for $log_xff {
    ""      "-";
    default $http_x_forwarded_for;
}

map $http_user_agent $log_ua {
    ""      "-";
    default $http_user_agent;
}

# --- что считать подозрительным ---------------------------------------------------

# Известные имена машины. Всё остальное дополнительно уходит в web-unknown.log: запрос
# по голому IP, по чужому домену, с пустым Host — типовой почерк сканера, который нашёл
# открытый порт и проверяет, что за ним.
#
# Список привязан к этой машине. Меняется адрес в LAN или имя узла в тайлнете — правьте здесь,
# иначе свой же трафик начнёт падать в журнал подозрительного.
map $host $log_unknown_host {
    default                         1;
    "spritenote.duckdns.org"        0;
    "YOUR-NODE.YOUR-TAILNET.ts.net" 0;
    "192.168.1.10"                  0;   # адрес машины в домашней сети
    "100.100.100.100"               0;   # адрес в тайлнете, `tailscale ip -4`
    "YOUR-HOSTNAME"                 0;   # hostname
    "localhost"                     0;
    "127.0.0.1"                     0;
}

# Источник вне домашней сети и тайлнета.
#
# Через Funnel клиент приходит с 127.0.0.1 — TLS снимает сам tailscaled и проксирует
# соединение локально, поэтому $remote_addr там всегда локальный, а настоящий адрес
# лежит в X-Forwarded-For. Он пишется в каждую строку отдельным полем xff=.
# Проверять один $remote_addr недостаточно: у трафика через Funnel он всегда 127.0.0.1,
# и внешний гость выглядел бы как локальный. Поэтому адрес считается по двум источникам,
# и «внешним» запрос признаётся, если хотя бы один из них указывает наружу.

# Первый адрес из X-Forwarded-For. Заголовок бывает списком «клиент, прокси1, прокси2» —
# нужен самый левый, остальные добавлены по дороге.
map $http_x_forwarded_for $log_client_addr {
    ""                    $remote_addr;
    "~^(?<first>[^,\s]+)" $first;
    default               $remote_addr;
}

geo $log_ext_remote {
    default             1;
    127.0.0.0/8         0;
    ::1/128             0;
    10.0.0.0/8          0;
    172.16.0.0/12       0;
    192.168.0.0/16      0;
    100.64.0.0/10       0;   # CGNAT провайдера и адреса тайлнета
    fd7a:115c:a1e0::/48 0;   # тайлнет по IPv6
}

geo $log_client_addr $log_ext_xff {
    default             1;
    127.0.0.0/8         0;
    ::1/128             0;
    10.0.0.0/8          0;
    172.16.0.0/12       0;
    192.168.0.0/16      0;
    100.64.0.0/10       0;
    fd7a:115c:a1e0::/48 0;
}

# Внешним считается запрос, у которого наружу смотрит хоть один адрес. Локальный+пустой XFF
# даёт «00» — свой; локальный + внешний XFF даёт «01» — это и есть гость через Funnel.
map "$log_ext_remote$log_ext_xff" $log_external_addr {
    "00"    0;
    default 1;
}

# --- формат и файлы ---------------------------------------------------------------

log_format webprobe
    '$time_iso8601 $remote_addr:$remote_port -> :$server_port '
    'xff=$log_xff host="$host" sni="$log_tls_sni" '
    '"$request" $status ${body_bytes_sent}b rt=$request_time '
    'tls=$log_tls_proto/$log_tls_cipher ua="$log_ua"';

# Всё, что дошло до HTTP-запроса на любом порту.
access_log /var/log/nginx/web-access.log webprobe;

# Срезы того же потока. if= пропускает строку, когда переменная равна "0" или пуста,
# поэтому карты выше отдают ровно 1 или 0.
access_log /var/log/nginx/web-unknown.log  webprobe if=$log_unknown_host;
access_log /var/log/nginx/web-external.log webprobe if=$log_external_addr;

# Оборванные и неудачные рукопожатия TLS, «http request sent to https port», клиенты,
# закрывшие соединение до ответа. В access_log ничего этого нет: там только запросы,
# которые состоялись.
#
# Первая строка повторяет штатный error.log. Она обязательна: error_log не складывается
# между уровнями, и без неё директива ниже увела бы из error.log вообще все ошибки http.
# Уровень info заметно подробнее стандартного — если файл начнёт расти, меняйте на notice.
error_log /var/log/nginx/error.log;
error_log /var/log/nginx/web-error.log info;
