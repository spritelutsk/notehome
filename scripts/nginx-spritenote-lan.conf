# LAN access over plain HTTP by IP address (no TLS — a certificate cannot cover a bare IP).
# Catches any Host that is not spritenotehome.duckdns.org: the LAN address, the tailnet
# address, the bare hostname. The domain keeps its own exact-match block, which still
# redirects to 443, because an exact server_name beats default_server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Same headers as the TLS vhost, minus HSTS: browsers ignore HSTS over plain HTTP,
    # and it would be wrong to assert it for an origin that has no certificate.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Админка — только из локальной сети и тайнета. Этот блок стоит default_server и ловит любой
    # Host, поэтому при пробросе 80-го порта на роутере он оказался бы дверью из интернета.
    # Проверка по адресу источника, а не по имени: имя подделывается заголовком, адрес — нет.
    # 404 вместо 403 — чтобы снаружи не подтверждать, что здесь что-то есть.
    location /api/admin {
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 100.64.0.0/10;   # адреса тайнета Tailscale
        deny all;
        error_page 403 = @admin_hidden;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        client_max_body_size 1100M;
    }

    location @admin_hidden {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        client_max_body_size 1100M;
    }
}
